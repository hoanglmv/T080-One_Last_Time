[project]
name = "one-last-time"
version = "0.1.0"
description = "AI20K agent built with FastAPI, LangChain, and LangGraph"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "kagglehub>=0.3.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.34.0",
    "pandas>=3.0.5",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.14.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
packages = ["src"]

